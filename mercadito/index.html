<style>
:root{
  --azul:#0DC0E0; --azul-osc:#0A8FA8; --amarillo:#F6F28F; --amarillo-osc:#D9D45E; --tinta:#2F4A57; --verde:#25D366; --rojo:#C0392B;
  --hoja:#FFFFFF; --fondo:#F2F8FA; --texto:#22343D; --suave:#5A717C; --linea:#DCE8EC; --circulo:#E6F8FC;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hoja:#15242C;--fondo:#0E1A20;--texto:#E8F2F5;--suave:#A6BCC5;--linea:#24363F;--circulo:#1E3540;--azul-osc:#5FD6EC;color-scheme:dark}}
:root[data-theme="dark"]{--hoja:#15242C;--fondo:#0E1A20;--texto:#E8F2F5;--suave:#A6BCC5;--linea:#24363F;--circulo:#1E3540;--azul-osc:#5FD6EC;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Fredoka","Arial Rounded MT Bold","Varela Round",system-ui,sans-serif;line-height:1.45}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.envoltura{max-width:980px;margin:0 auto;padding:0 16px}

.cab{background:var(--azul);color:#fff;padding:14px 0 18px}
.cab .fila{display:flex;align-items:center;gap:14px}
.cab img{width:74px;height:auto;flex:0 0 auto}
.cab h1{margin:0;font-size:1.7rem;line-height:1.1}
.cab p{margin:4px 0 0;font-size:.98rem}
.volver{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:500;font-size:.92rem;margin-bottom:10px;opacity:.95}
.buscar{margin-top:14px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 6px 4px 16px}
.buscar input{flex:1;border:0;outline:0;background:transparent;color:#22343D;font-size:1rem;padding:9px 0;min-width:0}
.buscar svg{flex:0 0 auto;color:#5A717C}

.filtros{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro{flex:0 0 auto;border:1.5px solid var(--linea);background:var(--hoja);border-radius:999px;padding:8px 15px;font-size:.95rem;font-weight:500;cursor:pointer}
.filtro.on{background:var(--tinta);border-color:var(--tinta);color:#fff}

h2.sec{font-size:1.2rem;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.prod{background:var(--hoja);border-radius:18px;padding:10px;border:2px solid transparent;cursor:pointer;text-align:left;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(20,60,75,.06)}
.prod.dest{border-color:#F6C543}
.prod .foto{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--circulo)}
.prod .foto img{width:100%;height:100%;object-fit:cover}
.marca{position:absolute;left:8px;top:8px;background:#F6C543;color:#4A3500;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px}
.prod b{display:block;margin:9px 0 2px;font-size:1rem;line-height:1.25}
.precio{color:var(--azul-osc);font-weight:600;font-size:1.05rem}
.prod small{color:var(--suave);font-size:.82rem;margin-top:auto;padding-top:4px}

.invita{margin:22px 0 8px;background:var(--hoja);border:2px dashed var(--azul);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px}
.invita b{display:block;font-size:1.08rem}
.invita p{margin:2px 0 0;color:var(--suave);font-size:.93rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-size:1.02rem;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.azul{background:var(--azul);color:#fff;box-shadow:0 4px 0 #0A8FA8}
.btn.verde{background:var(--verde);color:#fff;box-shadow:0 4px 0 #1A9E4C}
.btn.claro{background:var(--circulo);color:var(--texto)}
.btn:active{transform:translateY(2px)}
.btn.ancho{width:100%}
.vacio{background:var(--hoja);border-radius:18px;padding:22px;text-align:center;color:var(--suave)}

.detalle{display:grid;gap:18px;padding:16px 0 30px}
@media (min-width:760px){.detalle{grid-template-columns:1fr 1fr;align-items:start}}
.galeria{background:var(--hoja);border-radius:22px;overflow:hidden}
.galeria img{width:100%;aspect-ratio:1;object-fit:cover}
.panel{background:var(--hoja);border-radius:22px;padding:18px}
.panel h1{margin:0 0 4px;font-size:1.5rem;line-height:1.2}
.panel ul{margin:12px 0;padding-left:20px}
.panel li{margin:3px 0}
.vendedor{display:flex;align-items:center;gap:12px;background:var(--fondo);border-radius:14px;padding:10px 12px;margin:14px 0}
.ini{width:40px;height:40px;border-radius:50%;background:var(--circulo);display:grid;place-items:center;font-weight:600;color:var(--azul-osc);flex:0 0 auto}
.vendedor b{display:block}
.vendedor small{color:var(--suave)}
.acciones{display:grid;gap:10px}
.entrega{display:flex;align-items:center;gap:12px;border:1.5px solid var(--linea);border-radius:14px;padding:11px 12px;text-decoration:none}
.entrega b{display:block}.entrega small{color:var(--suave)}
.aviso{font-size:.85rem;color:var(--suave);text-align:center;margin:12px 0 0}
.chip{display:inline-block;background:var(--circulo);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:500}

.formulario{background:var(--hoja);border-radius:22px;padding:18px;margin:16px 0 30px}
.formulario h1{margin:0 0 4px;font-size:1.5rem}
.formulario>p{margin:0 0 6px;color:var(--suave)}
label{display:block;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--suave)}
.campo{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--hoja);font-size:1rem}
textarea.campo{min-height:88px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.dos{grid-template-columns:1fr}}
.casilla{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:400;cursor:pointer}
.casilla input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--azul-osc)}
.casilla.dest{background:#FFF6D6;color:#4A3500;border-radius:14px;padding:12px}
:root[data-theme="dark"] .casilla.dest{background:#3A3216;color:#F6E7A1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .casilla.dest{background:#3A3216;color:#F6E7A1}}
.error{color:var(--rojo);font-size:.88rem;margin:6px 0 0;min-height:0}
.campo.mal{border-color:var(--rojo)}
.paso{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.paso span{width:26px;height:26px;border-radius:50%;background:var(--amarillo);color:var(--tinta);display:grid;place-items:center;font-weight:600;flex:0 0 auto}
.listo{background:var(--hoja);border-radius:22px;padding:24px 18px;margin:16px 0 30px;text-align:center}
.listo .ok{width:76px;height:76px;border-radius:50%;background:#E1F5EE;color:#0F6E56;display:grid;place-items:center;margin:0 auto 12px}

footer{text-align:center;color:var(--suave);font-size:.88rem;padding:10px 16px 34px}
#aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#aviso.ver{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===================================== */

const WA_PETMTY = "528135700142";
const CATEGORIAS = { alimento:"Alimento", premios:"Premios y snacks", juguetes:"Juguetes", camas:"Camas y cobijas", paseo:"Collares, correas y arneses", ropa:"Ropa y disfraces", higiene:"Higiene y aseo", platos:"Platos y bebederos", viaje:"Transportadoras y viaje", casas:"Casas y corrales", salud:"Salud y bienestar", gatos:"Arena y rascadores", personalizados:"Personalizados y regalos", memorial:"Memorial" };
const MUNICIPIOS = ["Monterrey","San Pedro Garza García","San Nicolás de los Garza","Guadalupe","Apodaca","General Escobedo","Santa Catarina","García","Juárez","Santiago","Otro"];
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const sinAcentos = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const wa = (num, texto) => "https://wa.me/" + num + "?text=" + encodeURIComponent(texto);
let FILTRO = "todo", BUSQUEDA = "", ORDEN = "azar";
/* Orden al azar: cambia en cada visita, pero se mantiene mientras la persona navega */
let SEMILLA;
try{ SEMILLA = +sessionStorage.getItem("merc-semilla") || 0; if(!SEMILLA){ SEMILLA = Math.floor(Math.random()*1e9)+1; sessionStorage.setItem("merc-semilla", SEMILLA); } }
catch(e){ SEMILLA = Math.floor(Math.random()*1e9)+1; }
function aleatorio(semilla){ let a = semilla >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const LUGAR_AZAR = {};
(function(){ const r = aleatorio(SEMILLA); PRODUCTOS.forEach(p => { LUGAR_AZAR[p.id] = r(); }); })();
function precioNum(p){ const m = String(p.precio).replace(/,/g,"").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : Infinity; }
function esNuevo(p){ if(!p.fecha) return false; const d = (new Date() - new Date(p.fecha + "T00:00:00")) / 864e5; return d >= 0 && d < 7; }
function ordenar(lista){
  const mun = (()=>{ try{ return localStorage.getItem("merc-municipio") || ""; }catch(e){ return ""; } })();
  const c = { azar:(a,b)=>LUGAR_AZAR[a.id]-LUGAR_AZAR[b.id], menor:(a,b)=>precioNum(a)-precioNum(b), mayor:(a,b)=>precioNum(b)-precioNum(a),
    nuevos:(a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")) || LUGAR_AZAR[a.id]-LUGAR_AZAR[b.id],
    cerca:(a,b)=>((b.vendedor.municipio===mun)-(a.vendedor.municipio===mun)) || LUGAR_AZAR[a.id]-LUGAR_AZAR[b.id] }[ORDEN] || ((a,b)=>0);
  return lista.slice().sort(c);
}
function elegirMunicipio(){
  let mun = ""; try{ mun = localStorage.getItem("merc-municipio") || ""; }catch(e){}
  const r = prompt("¿En qué municipio estás? (Monterrey, Guadalupe, San Nicolás de los Garza, San Pedro Garza García, Apodaca, General Escobedo, Santa Catarina, García, Juárez, Santiago)", mun);
  if(r === null) return false;
  const elegido = MUNICIPIOS.find(m => sinAcentos(m).startsWith(sinAcentos(r.trim()).slice(0,6)) && r.trim()) || r.trim();
  try{ localStorage.setItem("merc-municipio", elegido); }catch(e){}
  return true;
}
function cambiarOrden(v){ if(v === "cerca" && !elegirMunicipio()){ pintar(); return; } ORDEN = v; pintar(); }

function esDestacado(p){
  if(p.destacado === true) return true;
  if(typeof p.destacado === "string") return new Date(p.destacado + "T23:59:59") >= new Date();
  return false;
}
function iniciales(n){ return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function aviso(t){ const a=$("#aviso"); a.textContent=t; a.classList.add("ver"); clearTimeout(aviso.t); aviso.t=setTimeout(()=>a.classList.remove("ver"),2400); }

function tarjeta(p){
  const d = esDestacado(p);
  return `<button class="prod${d?" dest":""}" onclick="location.hash='p=${esc(p.id)}'">
    <div class="foto">${p.fotos && p.fotos[0] ? `<img src="${p.fotos[0]}" alt="${esc(p.nombre)}" loading="lazy">` : ""}${d?`<span class="marca">Destacado</span>`:esNuevo(p)?`<span class="marca" style="background:#E5484D;color:#fff">Nuevo</span>`:""}</div>
    <b>${esc(p.nombre)}</b>
    <span class="precio">${esc(p.precio)}</span>
    <small>${esc(p.vendedor.nombre)} · ${esc(p.vendedor.municipio)}</small>
  </button>`;
}

function vLista(){
  const q = sinAcentos(BUSQUEDA.trim());
  const lista = PRODUCTOS.filter(p => (FILTRO==="todo" || p.categoria===FILTRO) &&
    (!q || sinAcentos(p.nombre+" "+(p.desc||[]).join(" ")+" "+p.vendedor.nombre+" "+p.vendedor.municipio).includes(q)));
  const dest = ordenar(lista.filter(esDestacado)), resto = ordenar(lista.filter(p => !esDestacado(p)));
  const f = (k,t) => `<button class="filtro${FILTRO===k?" on":""}" onclick="FILTRO='${k}';pintar()">${t}</button>`;
  const o = (k,t) => `<option value="${k}"${ORDEN===k?" selected":""}>${t}</option>`;
  return `<div class="filtros" role="group" aria-label="Categorías">${f("todo","Todo")}${Object.entries(CATEGORIAS).map(([k,t])=>f(k,t)).join("")}</div>
  <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:6px"><label for="orden" style="margin:0;font-weight:500;color:var(--suave);font-size:.92rem">Ordenar:</label>
  <select id="orden" class="campo" style="width:auto;padding:7px 12px;font-size:.92rem" onchange="cambiarOrden(this.value)">${o("azar","Recomendados")}${o("nuevos","Más nuevos")}${o("menor","Precio: menor a mayor")}${o("mayor","Precio: mayor a menor")}${o("cerca","Cerca de mí")}</select></div>
  ${dest.length?`<h2 class="sec">⭐ Destacados</h2><div class="grid">${dest.map(tarjeta).join("")}</div>`:""}
  ${resto.length?`<h2 class="sec">${ORDEN==="azar"?"Más productos":"Productos"}</h2><div class="grid">${resto.map(tarjeta).join("")}</div>`:""}
  ${!lista.length?`<div class="vacio" style="margin-top:14px"><b style="display:block;color:var(--texto);font-size:1.1rem">Todavía no hay productos aquí</b>¿Vendes algo así? Sé de los primeros en publicarlo.</div>`:""}
  <div class="invita">
    <div style="flex:1"><b>¿Vendes productos para mascotas?</b><p>Publícalos gratis y recibe pedidos directo en tu WhatsApp.</p></div>
    <a class="btn azul" href="#publicar">Publicar</a>
  </div>`;
}

function vDetalle(id){
  const p = PRODUCTOS.find(x => x.id === id);
  if(!p) return `<div class="vacio" style="margin:18px 0">Este producto ya no está disponible.<br><br><a class="btn claro" href="#">Ver el Mercadito</a></div>`;
  const v = p.vendedor, esPetmty = v.whatsapp === WA_PETMTY;
  const msg = p.msg || `Hola, vi tu producto "${p.nombre}" (${p.precio}) en el Mercadito PetMTY y me interesa 🐾`;
  return `<div style="padding-top:12px"><a class="btn claro" href="#" style="padding:8px 14px;font-size:.92rem">‹ Volver al Mercadito</a></div>
  <div class="detalle">
    <div class="galeria">${(p.fotos||[]).map(f=>`<img src="${f}" alt="${esc(p.nombre)}">`).join("")}</div>
    <div class="panel">
      <span class="chip">${esc(CATEGORIAS[p.categoria]||"Producto")}</span>${esDestacado(p)?` <span class="chip" style="background:#F6C543;color:#4A3500">Destacado</span>`:""}
      <h1 style="margin-top:10px">${esc(p.nombre)}</h1>
      <span class="precio" style="font-size:1.35rem">${esc(p.precio)}</span>
      ${(p.desc||[]).length?`<ul>${p.desc.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
      <div class="vendedor"><span class="ini">${esc(iniciales(v.nombre))}</span><div style="flex:1"><b>${esc(v.nombre)}</b><small>${esc(v.municipio)}${v.verificado?" · vendedor verificado":""}</small></div></div>
      <div class="acciones">
        <a class="btn verde ancho" href="${wa(v.whatsapp,msg)}" target="_blank" rel="noopener">Lo quiero · escribir por WhatsApp</a>
        ${esPetmty?"":`<a class="entrega" href="${wa(WA_PETMTY,`Hola PetMTY 🚐 Quiero que me lleven el producto "${p.nombre}" de ${v.nombre} (${v.municipio}). ¿Cuánto cuesta la entrega a mi domicilio?`)}" target="_blank" rel="noopener">
          <span style="font-size:1.5rem" aria-hidden="true">🚐</span><span style="flex:1"><b>Entrega PetMTY</b><small>Te lo llevamos a casa · cotiza el envío</small></span><span aria-hidden="true">›</span></a>`}
        <button class="btn claro ancho" onclick="compartir('${esc(p.id)}')">Compartir</button>
      </div>
      <p class="aviso">${esPetmty?"Producto de PetMTY.":"El pago es directo con el vendedor. Nunca deposites sin confirmar con él."}</p>
    </div>
  </div>`;
}

function opciones(lista, sel){ return lista.map(o => `<option${o===sel?" selected":""}>${esc(o)}</option>`).join(""); }
function vPublicar(){
  return `<div class="formulario">
    <h1>Publica tu producto</h1>
    <p>Es gratis. Lo revisamos y te avisamos por WhatsApp cuando esté publicado.</p>
    <div class="paso"><span>1</span><div>Llena tus datos aquí abajo.</div></div>
    <div class="paso"><span>2</span><div>Se abre WhatsApp con tu solicitud: envíala y <b>agrega hasta 3 fotos</b> de tu producto en el chat.</div></div>
    <form id="fPub" novalidate>
      <label for="fNom">Nombre del producto</label><input class="campo" id="fNom" maxlength="60" placeholder="Camita acolchada mediana">
      <div class="dos">
        <div><label for="fPre">Precio</label><input class="campo" id="fPre" maxlength="30" placeholder="$450"></div>
        <div><label for="fCat">Categoría</label><select class="campo" id="fCat"><option value="">Elige una</option>${Object.values(CATEGORIAS).filter(c=>c!=="Memorial").map(c=>`<option>${c}</option>`).join("")}<option>Otro</option></select></div>
      </div>
      <label for="fDes">Descripción <small>(medidas, material, tallas, colores)</small></label><textarea class="campo" id="fDes" maxlength="400"></textarea>
      <label for="fTie">Nombre de tu tienda o tu nombre</label><input class="campo" id="fTie" maxlength="50" placeholder="Tienda Huellitas">
      <div class="dos">
        <div><label for="fMun">Municipio</label><select class="campo" id="fMun"><option value="">Elige uno</option>${opciones(MUNICIPIOS)}</select></div>
        <div><label for="fWa">Tu WhatsApp <small>(10 dígitos)</small></label><input class="campo" id="fWa" type="tel" inputmode="numeric" maxlength="14" placeholder="81 1234 5678"></div>
      </div>
      <label class="casilla dest"><input type="checkbox" id="fDest"><span><b>Quiero destacarlo</b> · sale primero, con borde dorado, por $49 a la semana</span></label>
      <label class="casilla"><input type="checkbox" id="fReg"><span>Acepto las reglas: no venta de animales ni de medicamentos con receta, alimentos con etiqueta e ingredientes claros, productos reales y en buen estado, y el pago es directo entre comprador y vendedor.</span></label>
      <p class="error" id="fErr" role="alert"></p>
      <button class="btn azul ancho" type="submit" style="margin-top:12px">Enviar por WhatsApp</button>
    </form>
  </div>`;
}
function vEnviado(){
  return `<div class="listo">
    <div class="ok"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1 style="margin:0 0 6px;font-size:1.4rem">¡Casi listo!</h1>
    <p style="color:var(--suave);margin:0 0 18px">Envía el mensaje en WhatsApp y <b>adjunta las fotos</b> de tu producto. Lo revisamos en menos de 24 horas y te avisamos cuando esté publicado.</p>
    <div class="acciones" style="max-width:360px;margin:0 auto">
      <a class="btn azul" href="#publicar">Publicar otro producto</a>
      <a class="btn claro" href="#">Volver al Mercadito</a>
    </div>
  </div>`;
}

function enviarPublicacion(e){
  e.preventDefault();
  const v = id => $(id).value.trim(), err = $("#fErr");
  document.querySelectorAll(".campo.mal").forEach(c => c.classList.remove("mal"));
  const tel = v("#fWa").replace(/\D/g,"").replace(/^52/,"");
  const faltan = [];
  [["#fNom","el nombre del producto"],["#fPre","el precio"],["#fCat","la categoría"],["#fTie","el nombre de tu tienda"],["#fMun","tu municipio"]].forEach(([id,t]) => { if(!v(id)){ faltan.push(t); $(id).classList.add("mal"); } });
  if(tel.length !== 10){ faltan.push("tu WhatsApp de 10 dígitos"); $("#fWa").classList.add("mal"); }
  if(faltan.length){ err.textContent = "Falta " + faltan.join(", ") + "."; return; }
  if(!$("#fReg").checked){ err.textContent = "Para publicar, acepta las reglas del Mercadito."; return; }
  err.textContent = "";
  const texto = `🛒 *Quiero publicar en el Mercadito PetMTY*
• Producto: ${v("#fNom")}
• Precio: ${v("#fPre")}
• Categoría: ${v("#fCat")}
• Descripción: ${v("#fDes") || "—"}
• Tienda: ${v("#fTie")}
• Municipio: ${v("#fMun")}
• WhatsApp: ${tel}
• Destacar ($49 a la semana): ${$("#fDest").checked ? "Sí" : "No"}
Acepto las reglas del Mercadito. Te envío las fotos en este chat 📷`;
  window.open(wa(WA_PETMTY, texto), "_blank", "noopener");
  location.hash = "enviado";
}

async function compartir(id){
  const p = PRODUCTOS.find(x => x.id === id), url = location.origin + location.pathname + "#p=" + id;
  try{
    if(navigator.share){ await navigator.share({title:p.nombre, text:`${p.nombre} · ${p.precio} en el Mercadito PetMTY`, url}); return; }
    await navigator.clipboard.writeText(url); aviso("Enlace copiado 📋");
  }catch(e){ if(e && e.name === "AbortError") return; aviso("No se pudo compartir"); }
}

function pintar(){
  const h = decodeURIComponent(location.hash.slice(1));
  const cuerpo = $("#vista");
  $("#cajaBuscar").style.display = h ? "none" : "";
  if(h.startsWith("p=")) cuerpo.innerHTML = vDetalle(h.slice(2));
  else if(h === "publicar"){ cuerpo.innerHTML = vPublicar(); $("#fPub").addEventListener("submit", enviarPublicacion);
    $("#fPub").addEventListener("input", () => { $("#fErr").textContent = ""; }); }
  else if(h === "enviado") cuerpo.innerHTML = vEnviado();
  else cuerpo.innerHTML = vLista();
  const p = h.startsWith("p=") && PRODUCTOS.find(x => x.id === h.slice(2));
  document.title = p ? `${p.nombre} · Mercadito PetMTY` : h === "publicar" ? "Publica tu producto · Mercadito PetMTY" : "Mercadito PetMTY · Productos para mascotas en Monterrey";
}
$("#busca").addEventListener("input", e => { BUSQUEDA = e.target.value; pintar(); });
window.addEventListener("hashchange", () => { pintar(); window.scrollTo(0,0); });
pintar();
</script>
</body>
</html>
